[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.27,<2",
]

[project]
name = "indy-hub"
description = "Indy Hub - An industrial management application for Alliance Auth"
readme = "README.md"
keywords = [
    "allianceauth",
    "eveonline",
    "hub",
    "industry",
    "indy",
]
license = { file = "LICENSE" }
authors = [
    { name = "erka Ekanon", email = "erkaekanon@outlook.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Celery",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5,<6",
    "allianceauth-app-utils>=1",
    "django>=5.2.8; python_version>='3.14'",
    "django-esi>=10.2,<11",
    "django-eveonline-sde>=2,<3",
    "requests>=2.31",
]

optional-dependencies.aadiscordbot = [
    "allianceauth-discordbot",
]
optional-dependencies.discordnotify = [
    "aa-discordnotify>=2",
]
urls.Homepage = "https://github.com/Erkaek/aa-Indy_Hub"
urls.Source = "https://github.com/Erkaek/aa-Indy_Hub"
urls.Tracker = "https://github.com/Erkaek/aa-Indy_Hub/issues"

[tool.hatch.version]
path = "indy_hub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [ "indy_hub" ]
exclude = [
    "/indy_hub/tests",
    "/indy_hub/temporary_prompt",
    "**/__pycache__",
    "**/*.py[cod]",
]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "/indy_hub",
    "/docs/INDUSTRY_RULES.md",
    "/docs/UPGRADE_NOTES.md",
    "/docs/PROCESS_RESOLUTION_INSTALL.md",
    "/docs/deployment/*.md",
    "/docs/deployment/*.conf",
    "/docs/screenshots/*.png",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/scripts/*.py",
    "/scripts/*.js",
    "/scripts/*.cjs",
    "/testauth/**/*.py",
    "/runtests.py",
    "/tox.ini",
    "/.coveragerc",
    "/package.json",
    "/package-lock.json",
    "/eslint.config.js",
    "/.stylelintrc.json",
]
exclude = [
    "/indy_hub/temporary_prompt",
    "**/__pycache__",
    "**/*.py[cod]",
]

[tool.isort]
profile = "django"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DJANGO",
    "ALLIANCEAUTH",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
known_allianceauth = [ "allianceauth", "esi" ]
known_django = [ "django" ]
skip_gitignore = true

[tool.flake8]
exclude = [ ".git", "*migrations*", ".tox", "dist", "htmlcov" ]
max-line-length = 119
select = [ "C", "E", "F", "W", "B", "B950" ]
ignore = [ "E203", "E231", "E501", "W503", "W291", "W293" ]

[tool.djlint]
max_attribute_length = 119
max_line_length = 119
max_blank_lines = 1
