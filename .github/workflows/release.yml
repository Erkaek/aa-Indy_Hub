name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine packaging
      - name: Validate the final tag and prepare release notes
        run: |
          mkdir -p "$RUNNER_TEMP/release-package/dist"
          python scripts/check_release.py --tag "$GITHUB_REF_NAME" --notes-output "$RUNNER_TEMP/release-package/release-notes.md"
      - name: Build and check the actual release archives
        run: |
          python -m build --outdir "$RUNNER_TEMP/release-package/dist"
          python scripts/check_release.py --tag "$GITHUB_REF_NAME" --dist "$RUNNER_TEMP/release-package/dist"
          python scripts/check_distribution.py "$RUNNER_TEMP/release-package/dist"
          python -m twine check --strict "$RUNNER_TEMP"/release-package/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-package
      - run: python -m pip install --upgrade twine
      - name: Upload checked archives
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_APIKEY }}
          TWINE_NON_INTERACTIVE: '1'
        run: python -m twine upload release-package/dist/*

  github-release:
    name: Publish GitHub release
    needs: [pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-package
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-package/release-notes.md
          files: release-package/dist/*
          fail_on_unmatched_files: true
          prerelease: false
