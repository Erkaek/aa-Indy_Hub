name: Tests

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: ['**']

jobs:
  pre-commit:
    name: Pre Commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit==4.5.1
      - name: Install hook environments
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pre-commit install-hooks; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1
      - name: Run pre-commit
        run: |
          if ! pre-commit run --all-files; then
            git status --short
            git --no-pager diff
            exit 1
          fi

  test-coverage:
    needs: [pre-commit]
    name: AA / CharLink (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            tox: py312
          - python: '3.13'
            tox: py313
          - python: '3.14'
            tox: py314
    steps:
      - uses: actions/checkout@v6
      - name: Install the packaging interpreter
        if: matrix.python != '3.12'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '7'
      - run: python -m pip install tox
      - run: tox -v -e ${{ matrix.tox }}

  database:
    needs: [pre-commit]
    name: AA / CharLink (${{ matrix.database }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.4', 'mariadb:10.11']
        python: ['3.12', '3.14']
        include:
          - python: '3.12'
            tox: py312-mysql
          - python: '3.14'
            tox: py314-mysql
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: indyhub_ci_only
          MYSQL_DATABASE: indyhub_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pindyhub_ci_only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6
      - name: Install the packaging interpreter
        if: matrix.python != '3.12'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install database build prerequisites and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config redis-server
      - run: python -m pip install tox
      - name: Test migrations and application on the disposable SQL server
        env:
          INDY_HUB_TEST_DB_HOST: 127.0.0.1
          INDY_HUB_TEST_DB_PORT: '3306'
          INDY_HUB_TEST_DB_USER: root
          INDY_HUB_TEST_DB_PASSWORD: indyhub_ci_only
        run: tox -v -e ${{ matrix.tox }}

  frontend:
    needs: [pre-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  prefork:
    needs: [pre-commit]
    name: Real prefork limits and routing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '7'
      - run: python -m pip install 'celery[redis]>=5.6,<6'
      - run: python scripts/test_prefork_time_limits.py

  pypi-build-test:
    needs: [test-coverage, database, frontend, prefork]
    name: PyPI build and distribution contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_distribution.py dist
      - name: Resolve the documented Discord extra
        run: python -m pip install --dry-run '.[aadiscordbot]'
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.event_name }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
