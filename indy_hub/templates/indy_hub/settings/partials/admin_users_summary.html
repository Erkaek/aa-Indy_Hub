{% load i18n %}
<div class="admin-users-summary-grid">
    <button type="button" class="admin-users-summary-card" data-preset="all"><span class="admin-users-summary-label">{% trans "Users" %}<i class="fas fa-users" aria-hidden="true"></i></span><strong>{{ summary.total }}</strong><span class="admin-users-summary-note">{% trans "Matching current filters" %}</span></button>
    <button type="button" class="admin-users-summary-card is-good" data-preset="active"><span class="admin-users-summary-label">{% trans "Active / 30d" %}<i class="fas fa-arrow-trend-up" aria-hidden="true"></i></span><strong>{{ summary.active }}</strong><span class="admin-users-summary-note">{% trans "Recent Indy Hub visits" %}</span></button>
    <button type="button" class="admin-users-summary-card is-warning" data-preset="incomplete"><span class="admin-users-summary-label">{% trans "Missing scopes" %}<i class="fas fa-key" aria-hidden="true"></i></span><strong>{{ summary.incomplete }}</strong><span class="admin-users-summary-note">{% trans "Authorizations to review" %}</span></button>
    <button type="button" class="admin-users-summary-card is-danger" data-preset="critical"><span class="admin-users-summary-label">{% trans "Critical" %}<i class="fas fa-triangle-exclamation" aria-hidden="true"></i></span><strong>{{ summary.critical }}</strong><span class="admin-users-summary-note">{% trans "Diagnosed accounts only" %}</span></button>
    <button type="button" class="admin-users-summary-card" data-preset="notifications"><span class="admin-users-summary-label">{% trans "Notifications off" %}<i class="fas fa-bell-slash" aria-hidden="true"></i></span><strong>{{ summary.notifications_off }}</strong><span class="admin-users-summary-note">{% trans "User preference" %}</span></button>
    <button type="button" class="admin-users-summary-card is-info" data-preset="pending"><span class="admin-users-summary-label">{% trans "Pending" %}<i class="fas fa-clock" aria-hidden="true"></i></span><strong>{{ summary.pending }}</strong><span class="admin-users-summary-note">{% trans "Diagnostics to rebuild" %}</span></button>
</div>
<div class="admin-users-summary-footer small text-body-secondary"><span>{% trans "Average health" %}: {{ summary.average_health }}/100</span><span>{% trans "Latest diagnostics" %}: {% if summary.updated_at %}{{ summary.updated_at|date:"Y-m-d H:i" }}{% else %}—{% endif %}</span></div>
