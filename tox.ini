[tox]
requires =
    tox>=4.2
env_list =
    py{314, 313, 312}
skip_missing_interpreters = false

[testenv]
package = editable
deps =
    aa-charlink>=1.15
    coverage
    django-sri<1
    django-webtest
    mysql: mysqlclient>=2.2
pass_env =
    INDY_HUB_TEST_DB_*
set_env =
    COVERAGE_FILE = {env_tmp_dir}/.coverage
    DJANGO_SETTINGS_MODULE = testauth.settings.local
    INDY_HUB_TEST_CHARLINK = 1
    mysql: INDY_HUB_TEST_DATABASE = mysql
commands_pre =
    python -m pip check
commands =
    coverage run runtests.py --verbosity=2 {posargs}

[testenv:py312]
commands =
    coverage run runtests.py --verbosity=2 {posargs}
    coverage report
    coverage xml -o {env_tmp_dir}/coverage.xml
install_command = python -m pip install -U {opts} {packages}

[testenv:.pkg]
base_python = python3.12
