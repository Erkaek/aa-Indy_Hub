[tox]
requires =
    tox>=4.2
env_list =
    py{312, 311, 310}
skip_missing_interpreters = false

[testenv]
package = editable
deps =
    coverage
    django-sri<1
    django-webtest
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
commands_pre =
    python -m pip check
commands =
    coverage run runtests.py --verbosity=2

[testenv:py312]
commands =
    coverage run runtests.py --verbosity=2
    coverage report
    coverage xml
install_command = python -m pip install -U {opts} {packages}
