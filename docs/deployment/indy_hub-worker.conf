# Add to the host Supervisor configuration after configuring the task route.
[program:worker_indy_hub]
command = %(ENV_AA_COMMAND_CELERY)s
    -A %(ENV_AA_PROJECT_NAME)s worker
    --pool=prefork
    --concurrency=2
    -Q indy_hub
    -n %(program_name)s_%(process_num)02d
directory = %(ENV_AA_PROJECT_DIRECTORY)s
user = %(ENV_AA_USER)s
numprocs = 1
process_name = %(program_name)s_%(process_num)02d
stdout_logfile = %(ENV_AA_PROJECT_DIRECTORY)s/log/%(program_name)s.log
stderr_logfile = %(ENV_AA_PROJECT_DIRECTORY)s/log/%(program_name)s.log
autostart = true
autorestart = true
startsecs = 10
stopwaitsecs = 960
stopasgroup = true
killasgroup = true
priority = 998
